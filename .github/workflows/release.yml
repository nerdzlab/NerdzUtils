name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $version" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  docs:
    name: Build and deploy DocC
    runs-on: macos-15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build documentation for every catalog
        id: catalog
        run: |
          set -o pipefail
          catalogs="$(find Sources -maxdepth 3 -name '*.docc' | sort)"
          if [ -z "$catalogs" ]; then
            echo "No DocC catalog found, skipping documentation." >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

          repo="${GITHUB_REPOSITORY#*/}"
          links=""
          for catalog in $catalogs; do
            module="$(basename "$(dirname "$catalog")")"
            slug="$(echo "$module" | tr '[:upper:]' '[:lower:]')"

            xcodebuild docbuild \
              -scheme "$module" \
              -destination 'platform=macOS' \
              -derivedDataPath ".build/docc-$slug" \
              2>&1 | tee "docbuild-$slug.log"
            if grep -iE '(^|[^/])(warning|error): ' "docbuild-$slug.log" | grep -v 'multiple matching'; then
              echo "DocC reported diagnostics for $module" >&2
              exit 1
            fi

            archive="$(find ".build/docc-$slug" -name "$module.doccarchive" -print -quit)"
            if [ -z "$archive" ]; then
              echo "No .doccarchive produced for $module" >&2
              exit 1
            fi

            "$(xcrun --find docc)" process-archive transform-for-static-hosting "$archive" \
              --output-path "_site/$slug" \
              --hosting-base-path "$repo/$slug"

            links="$links<li><a href=\"./$slug/documentation/$slug/\">$module</a></li>"
          done

          cat > _site/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>Documentation</title>
          <h1>$repo</h1>
          <ul>$links</ul>
          HTML

      - name: Upload artifact
        if: steps.catalog.outputs.found == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to Pages
        if: steps.catalog.outputs.found == 'true'
        id: deploy
        uses: actions/deploy-pages@v5
