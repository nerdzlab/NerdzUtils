name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $version" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  docs:
    name: Build and deploy DocC
    runs-on: macos-15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version

      - name: Locate the documentation catalog
        id: catalog
        run: |
          catalog="$(find Sources -maxdepth 3 -name '*.docc' -print -quit)"
          if [ -z "$catalog" ]; then
            echo "No DocC catalog found, skipping documentation." >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          module="$(basename "$(dirname "$catalog")")"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$catalog" >> "$GITHUB_OUTPUT"
          echo "module=$module" >> "$GITHUB_OUTPUT"

      - name: Emit symbol graphs
        if: steps.catalog.outputs.found == 'true'
        run: >
          swift build
          -Xswiftc -emit-symbol-graph
          -Xswiftc -emit-symbol-graph-dir -Xswiftc .build/symbol-graphs

      - name: Build documentation
        if: steps.catalog.outputs.found == 'true'
        run: |
          set -o pipefail
          "$(xcrun --find docc)" convert \
            "${{ steps.catalog.outputs.path }}" \
            --fallback-display-name "${{ steps.catalog.outputs.module }}" \
            --fallback-bundle-identifier "com.nerdzlab.${{ steps.catalog.outputs.module }}" \
            --additional-symbol-graph-dir .build/symbol-graphs \
            --output-path _site \
            --transform-for-static-hosting \
            --hosting-base-path "${GITHUB_REPOSITORY#*/}" \
            2>&1 | tee docc.log
          if grep -iE '(^|[^/])(warning|error): ' docc.log; then
            echo "DocC reported diagnostics" >&2
            exit 1
          fi

      - name: Upload artifact
        if: steps.catalog.outputs.found == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        if: steps.catalog.outputs.found == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
